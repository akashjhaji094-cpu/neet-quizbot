version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quizbot_postgres
    restart: always
    environment:
      POSTGRES_USER: quizbot_user
      POSTGRES_PASSWORD: quizbot_password
      POSTGRES_DB: quizbot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizbot_user -d quizbot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  quizbot:
    build: .
    container_name: quizbot_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=postgresql://quizbot_user:quizbot_password@db:5432/quizbot_db
      - BOT_USERNAME=${BOT_USERNAME}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - PORT=8000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
